site_name: Enterprise AKS GitOps Platform
site_description: Production-inspired GitOps application platform for Azure Kubernetes Service
site_author: Harshil Amin
repo_name: harshilamin/enterprise-aks-gitops-platform
repo_url: https://github.com/harshilamin/enterprise-aks-gitops-platform
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_div_format
  - pymdownx.highlight

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Repository Structure: architecture/repository-structure.md
      - Delivery Model: architecture/delivery-model.md
      - Secure Sample API: architecture/sample-api.md
      - Helm Chart: architecture/helm-chart.md
      - GitOps Architecture: architecture/gitops-architecture.md
      - Decisions:
          - ADR Index: adr/README.md
          - Argo CD: adr/0001-use-argocd-for-gitops.md
          - Helm: adr/0002-use-helm-for-packaging.md
          - Immutable Images: adr/0003-promote-immutable-images.md
          - Repository Separation: adr/0004-separate-infrastructure-and-workloads.md
          - Asymmetric Sync: adr/0005-use-asymmetric-sync-policies.md
          - Adjacent Digest Promotion: adr/0006-promote-adjacent-image-digests.md
  - Security:
      - Security Model: security/security-model.md
      - Container Security: security/container-security.md
      - Kubernetes Workload Security: security/kubernetes-workload-security.md
      - Argo CD Security: security/argocd-security.md
  - Operations:
      - Local Development: operations/local-development.md
      - Helm Operations: operations/helm-operations.md
      - Argo CD Bootstrap: operations/argocd-bootstrap.md
      - Image Promotion: operations/image-promotion.md
      - Drift and Rollback: operations/drift-and-rollback.md
      - Release Process: operations/release-process.md
  - Testing:
      - Application Testing: testing/application-testing.md
      - Helm Testing: testing/helm-testing.md
      - GitOps Testing: testing/gitops-testing.md
  - Portfolio:
      - Interview Story: portfolio/interview-story.md
      - v1.1.0 Interview Story: portfolio/v1.1.0-interview-story.md
      - v1.2.0 Interview Story: portfolio/v1.2.0-interview-story.md
      - v1.3.0 Interview Story: portfolio/v1.3.0-interview-story.md
  - Releases:
      - v1.0.0 Checklist: releases/v1.0.0-checklist.md
      - v1.1.0 Checklist: releases/v1.1.0-checklist.md
      - v1.2.0 Checklist: releases/v1.2.0-checklist.md
      - v1.3.0 Checklist: releases/v1.3.0-checklist.md
