name: Workload Identity CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/sample-api/**"
      - "gitops/projects/**"
      - "gitops/environments/**/workload-identity.example.yaml"
      - "platform/identity/**"
      - "scripts/generate_workload_identity_values.py"
      - "scripts/generate-workload-identity-values.ps1"
      - "scripts/validate_identity.py"
      - "scripts/validate-identity.*"
      - "tests/identity/**"
      - "requirements-identity.txt"
      - ".github/workflows/identity-ci.yml"
  push:
    branches:
      - main
    paths:
      - "charts/sample-api/**"
      - "gitops/projects/**"
      - "gitops/environments/**/workload-identity.example.yaml"
      - "platform/identity/**"
      - "scripts/generate_workload_identity_values.py"
      - "scripts/generate-workload-identity-values.ps1"
      - "scripts/validate_identity.py"
      - "scripts/validate-identity.*"
      - "tests/identity/**"
      - "requirements-identity.txt"
      - ".github/workflows/identity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workload-identity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  values:
    name: Test non-secret values generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-identity.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-identity.txt

      - name: Run values unit tests
        run: >-
          python -m unittest discover
          -s tests/identity
          -p "test_*.py"
          -v

  render:
    name: Render ${{ matrix.environment }} identity integration
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - qa
          - prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-helm.txt
            requirements-identity.txt

      - name: Install validation dependencies
        run: >-
          python -m pip install
          -r requirements-helm.txt
          -r requirements-identity.txt

      - name: Lint identity-enabled chart
        run: >-
          helm lint charts/sample-api
          --strict
          --values charts/sample-api/values-${{ matrix.environment }}.yaml
          --values gitops/environments/${{ matrix.environment }}/values.yaml
          --values charts/sample-api/values-workload-identity-ci.yaml

      - name: Render identity-enabled desired state
        shell: bash
        run: |
          mkdir -p .rendered/identity
          helm template sample-api charts/sample-api             --namespace sample-api-${{ matrix.environment }}             --values charts/sample-api/values-${{ matrix.environment }}.yaml             --values gitops/environments/${{ matrix.environment }}/values.yaml             --values charts/sample-api/values-workload-identity-ci.yaml             --include-crds             > .rendered/identity/sample-api-${{ matrix.environment }}.yaml

      - name: Validate base workload controls
        run: >-
          python scripts/validate-rendered-manifests.py
          .rendered/identity/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}

      - name: Validate identity and secret-mount controls
        run: >-
          python scripts/validate_identity.py
          .rendered/identity/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}
          --repository-root .

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            -kubernetes-version 1.36.0
            .rendered/identity/sample-api-${{ matrix.environment }}.yaml

      - name: Upload rendered identity manifest
        uses: actions/upload-artifact@v7
        with:
          name: workload-identity-${{ matrix.environment }}-manifest
          path: .rendered/identity/sample-api-${{ matrix.environment }}.yaml
          retention-days: 14
          if-no-files-found: error
