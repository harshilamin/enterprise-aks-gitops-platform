name: Final Platform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/sample-api/**"
      - "gitops/**"
      - "platform/scaling/**"
      - "platform/progressive-delivery/**"
      - "platform/resilience/**"
      - "platform/policies/**"
      - "scripts/validate_final_platform.py"
      - "tests/final-platform/**"
      - ".github/workflows/final-platform-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.environment }} final platform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-helm.txt
            requirements-final.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-helm.txt -r requirements-final.txt
      - name: Lint final desired state
        run: >-
          helm lint charts/sample-api
          --strict
          --values charts/sample-api/values-${{ matrix.environment }}.yaml
          --values gitops/environments/${{ matrix.environment }}/values.yaml
      - name: Render final desired state
        shell: bash
        run: |
          mkdir -p .rendered/final
          helm template sample-api charts/sample-api \
            --namespace sample-api-${{ matrix.environment }} \
            --values charts/sample-api/values-${{ matrix.environment }}.yaml \
            --values gitops/environments/${{ matrix.environment }}/values.yaml \
            --include-crds \
            > .rendered/final/sample-api-${{ matrix.environment }}.yaml
      - name: Validate final platform contracts
        run: >-
          python scripts/validate_final_platform.py
          .rendered/final/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}
          --repository-root .
      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            -kubernetes-version 1.36.0
            .rendered/final/sample-api-${{ matrix.environment }}.yaml
      - name: Upload final manifest
        uses: actions/upload-artifact@v7
        with:
          name: final-${{ matrix.environment }}-manifest
          path: .rendered/final/sample-api-${{ matrix.environment }}.yaml
          retention-days: 30
          if-no-files-found: error
