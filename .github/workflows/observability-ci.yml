name: Observability CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/sample-api/**"
      - "charts/sample-api/**"
      - "platform/observability/**"
      - "gitops/applications/kube-prometheus-stack.yaml"
      - "gitops/projects/**"
      - "scripts/validate_observability.py"
      - "scripts/validate-observability.*"
      - "tests/observability/**"
      - "requirements-observability.txt"
      - ".github/workflows/observability-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/sample-api/**"
      - "charts/sample-api/**"
      - "platform/observability/**"
      - "gitops/applications/kube-prometheus-stack.yaml"
      - "gitops/projects/**"
      - "scripts/validate_observability.py"
      - "scripts/validate-observability.*"
      - "tests/observability/**"
      - "requirements-observability.txt"
      - ".github/workflows/observability-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Test observability contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-observability.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-observability.txt
      - name: Run contract tests
        run: python -m unittest discover -s tests/observability -p "test_*.py" -v

  render:
    name: Render ${{ matrix.environment }} observability
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-helm.txt
            requirements-observability.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-helm.txt -r requirements-observability.txt
      - name: Lint chart
        run: >-
          helm lint charts/sample-api
          --strict
          --values charts/sample-api/values-${{ matrix.environment }}.yaml
          --values gitops/environments/${{ matrix.environment }}/values.yaml
      - name: Render manifests
        shell: bash
        run: |
          mkdir -p .rendered/observability
          helm template sample-api charts/sample-api             --namespace sample-api-${{ matrix.environment }}             --values charts/sample-api/values-${{ matrix.environment }}.yaml             --values gitops/environments/${{ matrix.environment }}/values.yaml             --include-crds             > .rendered/observability/sample-api-${{ matrix.environment }}.yaml
      - name: Validate base workload controls
        run: >-
          python scripts/validate-rendered-manifests.py
          .rendered/observability/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}
      - name: Validate observability contracts
        run: >-
          python scripts/validate_observability.py
          .rendered/observability/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}
          --repository-root .
      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            -kubernetes-version 1.36.0
            .rendered/observability/sample-api-${{ matrix.environment }}.yaml
      - name: Upload rendered manifest
        uses: actions/upload-artifact@v7
        with:
          name: observability-${{ matrix.environment }}-manifest
          path: .rendered/observability/sample-api-${{ matrix.environment }}.yaml
          retention-days: 14
          if-no-files-found: error
