name: Repository CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run foundation validation
        shell: bash
        run: |
          chmod +x scripts/validate-foundation.sh
          ./scripts/validate-foundation.sh

  yaml:
    name: Validate YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Parse YAML files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              *Path(".github").rglob("*.yml"),
              *Path(".github").rglob("*.yaml"),
              Path("mkdocs.yml"),
              Path("compose.yaml"),
          ]

          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Validated {path}")
          PY
