name: Sample API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/sample-api/**"
      - "pyproject.toml"
      - ".python-version"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/*app*"
      - "scripts/build-image*"
      - ".github/workflows/app-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/sample-api/**"
      - "pyproject.toml"
      - ".python-version"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/*app*"
      - "scripts/build-image*"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy apps/sample-api/src

      - name: Test
        run: python -m pytest

  container:
    name: Build, smoke test, scan, and generate SBOM
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build hardened image
        run: >-
          docker build
          --file apps/sample-api/Dockerfile
          --tag enterprise-aks-sample-api:ci
          .

      - name: Start hardened container
        run: >-
          docker run --detach
          --name sample-api-ci
          --publish 8080:8080
          --read-only
          --tmpfs /tmp:size=16m
          --cap-drop ALL
          --security-opt no-new-privileges
          enterprise-aks-sample-api:ci

      - name: Smoke test container
        shell: bash
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "${ready}" != "true" ]]; then
            docker logs sample-api-ci
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health/live
          curl --fail --silent http://127.0.0.1:8080/api/v1/info

      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-aks-sample-api:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Block critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-aks-sample-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-aks-sample-api:ci
          format: cyclonedx
          output: sample-api-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sample-api-sbom
          path: sample-api-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Show container logs
        if: always()
        run: docker logs sample-api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force sample-api-ci || true
