name: GitOps CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitops/**"
      - "platform/argocd/**"
      - "charts/sample-api/**"
      - "scripts/promote_image.py"
      - "scripts/render_gitops_applications.py"
      - "scripts/validate_gitops.py"
      - "scripts/validate-gitops.*"
      - "tests/gitops/**"
      - "requirements-gitops.txt"
      - ".github/workflows/gitops-ci.yml"
  push:
    branches:
      - main
    paths:
      - "gitops/**"
      - "platform/argocd/**"
      - "charts/sample-api/**"
      - "scripts/promote_image.py"
      - "scripts/render_gitops_applications.py"
      - "scripts/validate_gitops.py"
      - "scripts/validate-gitops.*"
      - "tests/gitops/**"
      - "requirements-gitops.txt"
      - ".github/workflows/gitops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argocd:
    name: Validate Argo CD desired state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-gitops.txt

      - name: Install GitOps validation dependencies
        run: python -m pip install -r requirements-gitops.txt

      - name: Validate Argo CD configuration
        run: python scripts/validate_gitops.py

      - name: Test immutable image promotion
        run: >-
          python -m unittest discover
          -s tests/gitops
          -p "test_*.py"
          -v

      - name: Render generated Applications
        run: >-
          python scripts/render_gitops_applications.py
          --output .rendered/gitops/applications.yaml

      - name: Upload generated Applications
        uses: actions/upload-artifact@v7
        with:
          name: generated-argocd-applications
          path: .rendered/gitops/applications.yaml
          retention-days: 14
          if-no-files-found: error

  desired-state:
    name: Render ${{ matrix.environment }} desired state
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - qa
          - prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-helm.txt
            requirements-gitops.txt

      - name: Install manifest validation dependencies
        run: >-
          python -m pip install
          -r requirements-helm.txt
          -r requirements-gitops.txt

      - name: Lint GitOps Helm composition
        run: >-
          helm lint charts/sample-api
          --strict
          --values charts/sample-api/values-${{ matrix.environment }}.yaml
          --values gitops/environments/${{ matrix.environment }}/values.yaml

      - name: Render GitOps desired state
        shell: bash
        run: |
          mkdir -p .rendered/gitops
          helm template sample-api charts/sample-api             --namespace sample-api-${{ matrix.environment }}             --values charts/sample-api/values-${{ matrix.environment }}.yaml             --values gitops/environments/${{ matrix.environment }}/values.yaml             --include-crds             > .rendered/gitops/sample-api-${{ matrix.environment }}.yaml

      - name: Validate workload invariants
        run: >-
          python scripts/validate-rendered-manifests.py
          .rendered/gitops/sample-api-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -kubernetes-version 1.36.0
            .rendered/gitops/sample-api-${{ matrix.environment }}.yaml

      - name: Upload rendered desired state
        uses: actions/upload-artifact@v7
        with:
          name: gitops-${{ matrix.environment }}-manifest
          path: .rendered/gitops/sample-api-${{ matrix.environment }}.yaml
          retention-days: 14
          if-no-files-found: error
