name: Helm CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "scripts/validate-helm.*"
      - "scripts/validate-rendered-manifests.py"
      - ".github/workflows/helm-ci.yml"
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "scripts/validate-helm.*"
      - "scripts/validate-rendered-manifests.py"
      - ".github/workflows/helm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - qa
          - prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-helm.txt

      - name: Install manifest validation dependency
        run: python -m pip install -r requirements-helm.txt

      - name: Lint chart
        run: >-
          helm lint charts/sample-api
          --strict
          --values charts/sample-api/values-${{ matrix.environment }}.yaml

      - name: Render manifests
        shell: bash
        run: |
          helm template sample-api charts/sample-api             --namespace sample-api-${{ matrix.environment }}             --values charts/sample-api/values-${{ matrix.environment }}.yaml             --include-crds > rendered-${{ matrix.environment }}.yaml

      - name: Validate security and reliability invariants
        run: >-
          python scripts/validate-rendered-manifests.py
          rendered-${{ matrix.environment }}.yaml
          --environment ${{ matrix.environment }}

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -kubernetes-version 1.36.0
            rendered-${{ matrix.environment }}.yaml

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v7
        with:
          name: sample-api-${{ matrix.environment }}-manifest
          path: rendered-${{ matrix.environment }}.yaml
          retention-days: 14
          if-no-files-found: error

  package:
    name: Package Helm chart
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/sample-api --destination dist
          helm show chart dist/sample-api-1.4.0.tgz

      - name: Upload chart package
        uses: actions/upload-artifact@v7
        with:
          name: sample-api-helm-chart
          path: dist/sample-api-1.4.0.tgz
          retention-days: 30
          if-no-files-found: error
