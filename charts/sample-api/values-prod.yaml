app:
  environment: production
  logLevel: INFO

replicaCount: 3

image:
  pullPolicy: IfNotPresent
  # The GitOps workflow will replace tag/digest with a verified immutable digest.
  tag: "2.0.0"
  digest: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Max

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

revisionHistoryLimit: 10
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels: {}
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}

observability:
  traces:
    sampleRatio: 0.1
  collector:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 3

resilience:
  minReadySeconds: 20
  antiAffinity:
    enabled: true
    type: required
    topologyKey: kubernetes.io/hostname
