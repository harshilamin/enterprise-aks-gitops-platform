{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sample-api.serviceAccountName" . }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
  {{- if or .Values.workloadIdentity.enabled .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is enabled" .Values.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "workloadIdentity.tenantId is required when workload identity is enabled" .Values.workloadIdentity.tenantId | quote }}
    azure.workload.identity/service-account-token-expiration: {{ .Values.workloadIdentity.serviceAccountTokenExpirationSeconds | quote }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
