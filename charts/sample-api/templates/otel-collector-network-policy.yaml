{{- if and .Values.networkPolicy.enabled .Values.observability.enabled .Values.observability.collector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sample-api.fullname" . }}-otel-collector
  labels:
    {{- include "sample-api.collectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sample-api.collectorSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sample-api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.collector.ports.otlpGrpc }}
        - protocol: TCP
          port: {{ .Values.observability.collector.ports.otlpHttp }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.observability.collector.ports.prometheus }}
        - protocol: TCP
          port: {{ .Values.observability.collector.ports.telemetry }}
  egress: []
{{- end }}
