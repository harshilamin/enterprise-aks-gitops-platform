# Copy these non-secret identifiers into a GitOps environment values file
# after provisioning the Azure identity, federated credential, and Key Vault RBAC.
workloadIdentity:
  enabled: true
  clientId: "11111111-1111-1111-1111-111111111111"
  tenantId: "22222222-2222-2222-2222-222222222222"
  serviceAccountTokenExpirationSeconds: 3600

azureKeyVault:
  enabled: true
  name: kv-sample-api-dev
  cloudName: ""
  mountPath: /mnt/secrets-store
  objects:
    - objectName: sample-api-signing-key
      objectVersion: ""
      objectAlias: signing-key
