nameOverride: ""
fullnameOverride: ""

app:
  name: enterprise-aks-sample-api
  environment: development
  logLevel: INFO

replicaCount: 2

image:
  repository: enterprise-aks-sample-api
  pullPolicy: IfNotPresent
  tag: "2.0.0"
  digest: ""

imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

workloadIdentity:
  enabled: false
  clientId: ""
  tenantId: ""
  serviceAccountTokenExpirationSeconds: 3600

azureKeyVault:
  enabled: false
  name: ""
  cloudName: ""
  mountPath: /mnt/secrets-store
  objects: []

observability:
  enabled: true
  serviceName: enterprise-aks-sample-api
  otlp:
    endpoint: ""
    metricExportIntervalMs: 15000
  traces:
    sampleRatio: 1.0
  collector:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      tag: "0.157.0"
      digest: ""
      pullPolicy: IfNotPresent
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      prometheus: 8889
      telemetry: 8888
      health: 13133
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    memoryLimitMiB: 384
    replicasForPdb: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    availabilityTarget: 0.995
    latencyThresholdSeconds: 0.5
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  annotations: {}

containerPort: 8080

probes:
  startup:
    enabled: true
    path: /health/startup
    initialDelaySeconds: 1
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
    successThreshold: 1
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 3
  prometheus:
    serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    metricName: sample_api_request_rate
    query: sum(rate(sample_api_http_server_request_count_total{http_route!~"/health/.*"}[2m]))
    threshold: "20"
    activationThreshold: "1"

progressiveDelivery:
  enabled: false
  controllerVersion: "1.9.1"
  minReadySeconds: 10
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 30s
      - setWeight: 25
      - analysis:
          templates:
            - templateName: sample-api-slo
      - setWeight: 50
      - pause:
          duration: 60s
      - setWeight: 100
  analysis:
    enabled: true
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    interval: 30s
    count: 3
    failureLimit: 1
    availabilityTarget: 0.995
    latencyThresholdSeconds: 0.5

resilience:
  minReadySeconds: 10
  terminationMessagePolicy: FallbackToLogsOnError
  antiAffinity:
    enabled: true
    type: preferred
    topologyKey: kubernetes.io/hostname

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Max

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: true
  allowSameNamespace: true
  monitoring:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
  ingressController:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/name: ingress-nginx
  dns:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  additionalIngress: []
  additionalEgress: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sample-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

revisionHistoryLimit: 5
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

enableServiceLinks: false

extraEnv: []
extraEnvFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}

priorityClassName: ""

helmTest:
  enabled: true
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
