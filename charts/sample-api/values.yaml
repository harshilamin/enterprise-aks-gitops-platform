nameOverride: ""
fullnameOverride: ""

app:
  name: enterprise-aks-sample-api
  environment: development
  logLevel: INFO

replicaCount: 2

image:
  repository: enterprise-aks-sample-api
  pullPolicy: IfNotPresent
  tag: "1.1.0"
  digest: ""

imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  annotations: {}

containerPort: 8080

probes:
  startup:
    enabled: true
    path: /health/startup
    initialDelaySeconds: 1
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
    successThreshold: 1
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Max

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: true
  allowSameNamespace: true
  dns:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  additionalIngress: []
  additionalEgress: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sample-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

revisionHistoryLimit: 5
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

enableServiceLinks: false

extraEnv: []
extraEnvFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}

priorityClassName: ""

helmTest:
  enabled: true
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
