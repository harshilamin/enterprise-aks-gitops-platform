# Non-secret example only. This file is not referenced by the ApplicationSet.
# Generate real identifiers with platform/identity/bootstrap-workload-identity.*
workloadIdentity:
  enabled: true
  clientId: "11111111-1111-1111-1111-111111111111"
  tenantId: "22222222-2222-2222-2222-222222222222"
  serviceAccountTokenExpirationSeconds: 3600

azureKeyVault:
  enabled: true
  name: kv-sample-api-prod
  cloudName: ""
  mountPath: /mnt/secrets-store
  objects:
    - objectName: sample-api-signing-key
      objectVersion: ""
      objectAlias: signing-key
